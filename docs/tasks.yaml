paths:

  /api/tasks/{taskId}:

    get:
      summary: Get a task by ID
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task found
        '404':
          description: Task not found
        '500':
          description: Failed to get task


    patch:
      summary: Update a task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Fix login bug
                description:
                  type: string
                  example: Fix authentication issue
                priority:
                  type: string
                  example: high

      responses:
        '200':
          description: Task updated
        '404':
          description: Task not found
        '500':
          description: Failed to update task


    delete:
      summary: Delete a task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Task deleted
        '404':
          description: Task not found
        '500':
          description: Failed to delete task


  /api/tasks/{taskId}/move:

    patch:
      summary: Move a task to another column
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - columnId
              properties:
                columnId:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000

      responses:
        '200':
          description: Task moved successfully
        '400':
          description: Invalid column ID
        '404':
          description: Task or column not found