openapi: 3.1.0

info:
  title: Funkban API
  description: REST API documentation for Funkban Kanban board
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:

  # Boards
  /api/boards:
    $ref: "./boards.yaml#/paths/~1api~1boards"

  /api/boards/{boardId}:
    $ref: "./boards.yaml#/paths/~1api~1boards~1{boardId}"

  /api/boards/{boardId}/columns:
    $ref: "./boards.yaml#/paths/~1api~1boards~1{boardId}~1columns"


  # Columns
  /api/columns/{columnId}:
    $ref: "./columns.yaml#/paths/~1api~1columns~1{columnId}"

  /api/columns/{columnId}/tasks:
    $ref: "./columns.yaml#/paths/~1api~1columns~1{columnId}~1tasks"


  # Tasks
  /api/tasks/{taskId}:
    $ref: "./tasks.yaml#/paths/~1api~1tasks~1{taskId}"

  /api/tasks/{taskId}/labels:
    $ref: "./tasks.yaml#/paths/~1api~1tasks~1{taskId}~1labels"

  /api/tasks/{taskId}/labels/{labelId}:
    $ref: "./tasks.yaml#/paths/~1api~1tasks~1{taskId}~1labels~1{labelId}"
  # Labels
  /api/labels/{labelId}:
    $ref: "./labels.yaml#/paths/~1api~1labels~1{labelId}"


components:

  schemas:

    Board:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Development Board


    Column:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Todo
        position:
          type: integer
          example: 0
        boardId:
          type: string
          format: uuid


    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Fix login bug
        description:
          type: string
          example: Fix authentication issue
        priority:
          type: string
          example: high
        columnId:
          type: string
          format: uuid


    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Bug