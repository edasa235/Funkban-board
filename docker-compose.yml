services:
  db:
    image: postgres:18.3-alpine
    container_name: postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d funkban"]
      interval: 5s
      timeout: 5s
      retries: 10
  swagger-ui:
      image: swaggerapi/swagger-ui
      ports:
        - "8080:8080"
      environment:
        SWAGGER_JSON: "/docs/openapi.yml"
      volumes:
        - ./docs:/docs:ro

  migrate:
    image: postgres:18.3-alpine

    depends_on:
      db:
        condition: service_healthy

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./src/DB:/migrations
  
    entrypoint: >
      sh -c "
      chmod +x /migrations/script/run_migration.sh &&
      /migrations/script/run_migration.sh
      "
  app:
    build: .
    container_name: funkban-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

volumes:
  db_data: