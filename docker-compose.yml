services:
  db:
    image: postgres:18.3-alpine
    container_name: postres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  swagger-ui:
      image: swaggerapi/swagger-ui
      ports:
        - "8080:8080"
      environment:
        SWAGGER_JSON: "/docs/openapi.yml"
      volumes:
        - ./docs:/docs:ro

  migrate:
    image: postgres:18.3-alpine
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./src/DB:/migrations
    entrypoint: >
      sh -c "
      sleep 3 &&
      chmod +x /migrations/script/run_migration.sh &&
      /migrations/script/run_migration.sh
      "

volumes:
  db_data: